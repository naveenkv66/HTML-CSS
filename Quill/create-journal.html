<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Journal</title>
    <h1>Create Journal</h1>
    <form action="api/v1/journals" method="post">
      <label for="main-title">Journal Title</label>
      <input
        id="main-title"
        type="text"
        name="title"
        placeholder="Enter title"
      />
      <br />

      <label for="journal-category">Journal Category</label>
      <select name="category" id="journal-category">
        <option value="task">Task</option>
        <option value="reflection">Reflection</option>
        <option value="idea">Idea</option>
        <option value="note">Note</option>
        <option value="habit">Habit</option>
        <option value="memory">Memory</option>
        <option value="mood">Mood</option>
        <option value="event">Event</option>
      </select>

      <br />

      <label for="journal-entry">Journal Entry</label>
      <textarea name="entry" id="journal-entry" cols="30" rows="5">
My day was</textarea
      >

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </head>
  <body></body>
</html>
